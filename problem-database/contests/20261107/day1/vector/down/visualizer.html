<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>vector · 路线可视化</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#faf9f6,#171918);--fg:light-dark(#252c2b,#e7ece8);--panel:light-dark(#fff,#202522);--line:light-dark(#d5ded8,#46544b);--muted:light-dark(#53645b,#b1c0b5);--green:light-dark(#146b50,#72dab0);--soft:light-dark(#e3f2e9,#263e32);--bad:light-dark(#a5222b,#ff9696);--blue:light-dark(#205e9c,#88bfff)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:24px}header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:18px}h1{font-size:24px;letter-spacing:.04em;font-weight:600;margin:0}header span{color:var(--muted)}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px}.fields{display:grid;align-content:start;gap:14px}.dims{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-weight:500}input,textarea,button,select{font:inherit;color:var(--fg)}input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px}textarea{height:270px;resize:vertical;font:14px/1.6 ui-monospace,Consolas,monospace}button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer;min-height:38px}button.primary{background:var(--green);color:var(--bg);border-color:var(--green)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:13px;color:var(--muted);margin:0}.visual{min-width:0;display:grid;align-content:start;gap:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.toolbar .space{flex:1}.viewport{height:430px;overflow:auto;border:1px solid var(--line);background:var(--panel);position:relative;overscroll-behavior:contain}.spacer{position:relative;min-width:100%;min-height:100%}canvas{position:absolute;left:0;top:0;display:block;touch-action:manipulation}input[type=range]{padding:0;border:0;accent-color:var(--green)}.state{min-height:48px;padding:10px 12px;background:var(--soft);border-radius:7px;white-space:pre-line}.state.bad{color:var(--bad);background:var(--panel);border:1px solid var(--bad)}.detail{font-variant-numeric:tabular-nums;color:var(--muted);min-height:24px}.tiny{font-size:13px;color:var(--muted)}footer{margin-top:18px;color:var(--muted);font-size:13px}@media(max-width:760px){main{padding:16px}.layout{grid-template-columns:1fr}.fields{gap:10px}textarea{height:150px}.viewport{height:380px}button{min-height:44px}}
</style></head><body><main>
<header><h1>vector</h1><span>路线播放 / 点击构造</span></header>
<div class="layout"><section class="fields" aria-label="输入">
<div class="dims"><label>n:<input id="n" type="number" min="1" max="1000000" value="3"></label><label>m:<input id="m" type="number" min="1" max="1000000" value="4"></label></div>
<label>操作序列:<textarea id="sequence" spellcheck="false" aria-describedby="format" placeholder="每行一个格子的坐标 x y&#10;1 1&#10;3 4&#10;…"></textarea></label>
<p class="hint" id="format">每行输入 x y，与程序输出格式一致。也可依次点击网格；第一点须为 (1, 1)。</p>
<div class="actions"><button id="load" class="primary" type="button">载入序列</button><button id="copy" type="button">复制序列</button><button id="undo" type="button">撤回最后一点</button><button id="clear" type="button">清空</button></div>
<div id="status" class="state" role="status" aria-live="polite"></div>
</section><section class="visual" aria-label="网格与播放控制">
<div class="toolbar"><button id="prev" type="button">上一步</button><button id="play" class="primary" type="button">播放</button><button id="next" type="button">下一步</button><span id="progress" class="tiny"></span><span class="space"></span><button id="out" type="button" aria-label="缩小网格">−</button><button id="in" type="button" aria-label="放大网格">＋</button><button id="locate" type="button">定位当前点</button></div>
<div id="viewport" class="viewport"><div id="spacer" class="spacer"><canvas id="canvas" aria-label="可点击的网格。坐标输入和撤回操作也可通过左侧文本框完成。"></canvas></div></div>
<label class="tiny">播放进度<input id="slider" type="range" min="0" max="0" value="0" step="1"></label>
<div id="detail" class="detail"></div><div class="tiny">格内数字为访问顺序。箭头表示当前跳跃；位移 (dx, dy) 保留正负号。大网格可滚动查看。</div>
</section></div><footer>离线运行，内容不上传。此工具用于调试；正式结果以评测 SPJ 为准。</footer>
</main><script>
(() => {
'use strict';
const $=id=>document.getElementById(id),ui={n:$('n'),m:$('m'),seq:$('sequence'),status:$('status'),vp:$('viewport'),spacer:$('spacer'),canvas:$('canvas'),slider:$('slider'),progress:$('progress'),detail:$('detail')};
const ctx=ui.canvas.getContext('2d');let n=3,m=4,points=[],rank=new Int32Array(12),moves=new Set(),step=0,cell=80,timer=null,valid=true;
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='播放';}
function message(text,bad=false){ui.status.textContent=text;ui.status.classList.toggle('bad',bad);}
function numberReader(text){let i=0;return()=>{while(i<text.length&&/\s/.test(text[i]))i++;if(i===text.length)return null;let sign=1;if(text[i]==='-'){sign=-1;i++;}if(i===text.length||text[i]<'0'||text[i]>'9')throw Error('序列包含非整数，请使用空白分隔 x y。');let v=0;while(i<text.length&&text[i]>='0'&&text[i]<='9'){v=v*10+text.charCodeAt(i++)-48;if(v>1000000000)throw Error('坐标整数过大。');}if(i<text.length&&!/\s/.test(text[i]))throw Error('序列包含非整数，请使用空白分隔 x y。');return sign*v;};}
function readDimensions(){const a=Number(ui.n.value),b=Number(ui.m.value);if(!Number.isSafeInteger(a)||!Number.isSafeInteger(b)||a<1||b<1||a*b>1000000)throw Error('须满足 n、m 为正整数且 n × m ≤ 1,000,000。');return[a,b];}
function load(){stop();ui.slider.disabled=false;try{
 [n,m]=readDimensions();points=[];rank=new Int32Array(n*m);moves=new Set();valid=true;
 const read=numberReader(ui.seq.value);let x;
 while((x=read())!==null){if(x===-1&&points.length===0)throw Error('本题每个合法网格都有解，不能输出 -1。');const y=read();if(y===null)throw Error('最后一个坐标缺少 y。');if(points.length>=n*m)throw Error('输出超过 n × m 个坐标。');if(x<1||x>n||y<1||y>m)throw Error(`第 ${points.length+1} 点 (${x}, ${y}) 越界。`);if(points.length===0&&(x!==1||y!==1))throw Error('起点必须为 (1, 1)。');if(rank[(x-1)*m+y-1])throw Error(`第 ${points.length+1} 点重复访问 (${x}, ${y})。`);if(points.length){const p=points[points.length-1],key=`${x-p[0]},${y-p[1]}`;if(moves.has(key))throw Error(`第 ${points.length} 次跳跃重复使用位移 (${key})。`);moves.add(key);}points.push([x,y]);rank[(x-1)*m+y-1]=points.length;
 }
 step=Math.max(0,points.length-1);cell=Math.min(cell,30000000/Math.max(n,m));updateStatus();resizeSpace();render();
 }catch(e){valid=false;step=Math.max(0,points.length-1);message(e.message,true);resizeSpace();render();}}
function updateStatus(){if(!points.length)message(`已输入 0 / ${n*m} 个格子。点击 (1, 1) 开始。`);else if(points.length===n*m)message(`完整合法：${n*m} 个格子均访问一次，${moves.size} 个位移向量互不重复。`);else message(`合法前缀：${points.length} / ${n*m} 个格子，${moves.size} 个不同位移。`);}
function resizeSpace(){ui.spacer.style.width=Math.max(m*cell,ui.vp.clientWidth)+'px';ui.spacer.style.height=Math.max(n*cell,ui.vp.clientHeight)+'px';}
function color(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}
function resolvedColor(name){const p=document.createElement('span');p.style.color=`var(${name})`;document.body.appendChild(p);const v=getComputedStyle(p).color;p.remove();return v;}
let colors={};function refreshColors(){for(const k of ['--panel','--fg','--line','--muted','--green','--soft'])colors[k]=resolvedColor(k);render();}
function center(p){return[(p[1]-.5)*cell-ui.vp.scrollLeft,(p[0]-.5)*cell-ui.vp.scrollTop];}
function render(){const w=ui.vp.clientWidth,h=ui.vp.clientHeight,dpr=window.devicePixelRatio||1;ui.canvas.style.left=ui.vp.scrollLeft+'px';ui.canvas.style.top=ui.vp.scrollTop+'px';ui.canvas.style.width=w+'px';ui.canvas.style.height=h+'px';if(ui.canvas.width!==Math.round(w*dpr)||ui.canvas.height!==Math.round(h*dpr)){ui.canvas.width=Math.round(w*dpr);ui.canvas.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=colors['--panel']||'#fff';ctx.fillRect(0,0,w,h);
 const l=ui.vp.scrollLeft,t=ui.vp.scrollTop,r0=Math.max(0,Math.floor(t/cell)),r1=Math.min(n,Math.ceil((t+h)/cell)),c0=Math.max(0,Math.floor(l/cell)),c1=Math.min(m,Math.ceil((l+w)/cell));
 for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){const x=c*cell-l,y=r*cell-t,k=rank[r*m+c];if(k&&k<=step+1){ctx.fillStyle=colors['--soft'];ctx.fillRect(x,y,cell,cell);}ctx.strokeStyle=colors['--line'];ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,cell,cell);if(cell>=24){ctx.font=`${cell<34?11:13}px system-ui`;ctx.fillStyle=colors['--muted'];ctx.textAlign='left';ctx.fillText(`${r+1},${c+1}`,x+3,y+12);}if(k&&cell>=30){ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillStyle=colors['--fg'];ctx.fillText(String(k),x+cell/2,y+cell-5);}}
 if(points.length){ctx.strokeStyle=colors['--muted'];ctx.globalAlpha=.28;ctx.lineWidth=1;ctx.beginPath();for(let i=Math.max(0,step-40);i<=step;i++){const p=center(points[i]);if(i===Math.max(0,step-40))ctx.moveTo(...p);else ctx.lineTo(...p);}ctx.stroke();ctx.globalAlpha=1;
 const current=center(points[step]);if(step>0){const a=center(points[step-1]),dx=current[0]-a[0],dy=current[1]-a[1],angle=Math.atan2(dy,dx);ctx.strokeStyle=colors['--green'];ctx.fillStyle=colors['--green'];ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...current);ctx.stroke();ctx.beginPath();ctx.moveTo(...current);ctx.lineTo(current[0]-11*Math.cos(angle-.4),current[1]-11*Math.sin(angle-.4));ctx.lineTo(current[0]-11*Math.cos(angle+.4),current[1]-11*Math.sin(angle+.4));ctx.closePath();ctx.fill();}ctx.fillStyle=colors['--green'];ctx.beginPath();ctx.arc(current[0],current[1],4,0,Math.PI*2);ctx.fill();
 ui.detail.textContent=step?`(${points[step-1].join(', ')}) → (${points[step].join(', ')})　位移 (${points[step][0]-points[step-1][0]}, ${points[step][1]-points[step-1][1]})`:`起点 (${points[0].join(', ')})`;}else ui.detail.textContent='等待输入或点击网格';
 ui.slider.max=Math.max(0,points.length-1);ui.slider.value=step;ui.progress.textContent=points.length?`第 ${step+1} / ${points.length} 点`:'0 点';$('prev').disabled=!points.length||step===0;$('next').disabled=!points.length||step===points.length-1;$('play').disabled=points.length<2;}
function locate(){if(!points.length)return;const p=points[step];ui.vp.scrollLeft=Math.max(0,(p[1]-.5)*cell-ui.vp.clientWidth/2);ui.vp.scrollTop=Math.max(0,(p[0]-.5)*cell-ui.vp.clientHeight/2);render();}
function select(value){step=Math.max(0,Math.min(points.length-1,value));render();locate();}
$('load').onclick=()=>{ui.slider.disabled=false;load();};ui.n.onchange=load;ui.m.onchange=load;
ui.seq.oninput=()=>{stop();valid=false;message('序列已修改，请点击“载入序列”。');for(const id of ['play','prev','next'])$(id).disabled=true;ui.slider.disabled=true;};
$('prev').onclick=()=>{stop();select(step-1);};$('next').onclick=()=>{stop();select(step+1);};ui.slider.oninput=()=>{stop();select(Number(ui.slider.value));};
$('play').onclick=()=>{if(timer!==null){stop();return;}if(step===points.length-1)select(0);$('play').textContent='暂停';timer=setInterval(()=>{select(step+1);if(step===points.length-1)stop();},450);};
$('locate').onclick=locate;$('in').onclick=()=>{cell=Math.min(cell*1.5,96,30000000/Math.max(n,m));resizeSpace();locate();render();};$('out').onclick=()=>{cell=Math.max(12,cell/1.5);resizeSpace();locate();render();};
ui.vp.onscroll=render;ui.canvas.onclick=e=>{if(!valid){message('请先修正序列，再点击网格。',true);return;}stop();const bounds=ui.canvas.getBoundingClientRect(),x=Math.floor((e.clientY-bounds.top+ui.vp.scrollTop)/cell)+1,y=Math.floor((e.clientX-bounds.left+ui.vp.scrollLeft)/cell)+1;if(x<1||x>n||y<1||y>m)return;if(!points.length&&(x!==1||y!==1)){message('第一点须点击 (1, 1)。',true);return;}if(rank[(x-1)*m+y-1]){message(`(${x}, ${y}) 已访问；可撤回最后一点。`,true);return;}let key;if(points.length){const p=points[points.length-1];key=`${x-p[0]},${y-p[1]}`;if(moves.has(key)){message(`位移 (${key}) 已使用，未加入该点。`,true);return;}}points.push([x,y]);rank[(x-1)*m+y-1]=points.length;if(key)moves.add(key);ui.seq.value+=(ui.seq.value.trim()?'\n':'')+`${x} ${y}`;step=points.length-1;updateStatus();render();};
$('undo').onclick=()=>{stop();if(points.length)points.pop();ui.seq.value=points.map(p=>p.join(' ')).join('\n');load();};$('clear').onclick=()=>{ui.seq.value='';load();};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(ui.seq.value);message('操作序列已复制。');}catch(e){ui.seq.focus();ui.seq.select();const ok=document.execCommand('copy');message(ok?'操作序列已复制。':'已选中序列，请按 Ctrl+C 复制。');}};
new ResizeObserver(()=>{resizeSpace();render();}).observe(ui.vp);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',refreshColors);refreshColors();load();
})();
</script></body></html>
